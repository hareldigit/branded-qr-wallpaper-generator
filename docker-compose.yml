version: '3.8'

services:
  bot:
    build: .
    container_name: branded-qr-wallpaper-bot
    env_file: .env
    volumes:
      - ./storage:/app/storage
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
